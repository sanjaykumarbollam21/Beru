name: Beru CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test-and-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. Hub Python Environment & Tests
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install pytest pytest-asyncio flake8 pip-audit

      - name: Lint Code
        run: |
          OUT=$(python -m flake8 hub tests --select=E9,F63,F7,F82 --show-source --statistics 2>&1) || {
            echo "::error title=Flake8 Failure::$OUT"
            echo "$OUT"
            exit 1
          }

      - name: Dependency Vulnerability Audit
        run: |
          pip-audit --desc || echo "Audit completed with advisory warnings"

      - name: Run Hub Test Suite
        run: |
          pytest tests/ -v

      # 2. Docker Compose Validation
      - name: Validate Docker Compose Config
        run: |
          docker compose -f deploy/docker-compose.yml config

      # 3. Flutter Mobile Verification
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Flutter Analyze & Test
        run: |
          cd beru_mobile
          flutter pub get
          flutter analyze
          flutter test

      # 4. Electron Desktop Verification
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Desktop Unit Tests
        run: |
          cd beru_desktop
          npm install
          npm test
