name: Beru CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test-and-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio flake8 pip-audit

      - name: Lint Code
        run: |
          flake8 hub tests --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Dependency Vulnerability Audit
        run: |
          pip-audit --desc || echo "Audit completed with advisory warnings"

      - name: Run Test Suite
        run: |
          pytest tests/ -v
