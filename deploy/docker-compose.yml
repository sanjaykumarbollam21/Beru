version: "3.8"

services:
  hub:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      - DATABASE_URL=sqlite:////app/data/beru.db
      - HUB_BASE_URL=https://${DOMAIN:-localhost}
      - BACKUP_DIR=/app/backups
      - TRANSFER_STORAGE_DIR=/app/data/transfers
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - BACKUP_ENCRYPTION_KEY=${BACKUP_ENCRYPTION_KEY:-}
      - TRANSFER_ENCRYPTION_KEY=${TRANSFER_ENCRYPTION_KEY:-}
    volumes:
      - beru_data:/app/data
      - beru_backups:/app/backups
    networks:
      - beru_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - beru_net
    depends_on:
      hub:
        condition: service_healthy

volumes:
  beru_data:
  beru_backups:
  caddy_data:
  caddy_config:

networks:
  beru_net:
    driver: bridge
